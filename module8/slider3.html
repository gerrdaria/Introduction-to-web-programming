<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <title>Слайдер со стрелками</title>
    <link rel="stylesheet" href="slider.css">
</head>

<body>

    <h1>Слайдер книг со стрелками</h1>

    <div class="arrow-slider">

        <input type="radio" name="arrow" id="arrow1" checked>
        <input type="radio" name="arrow" id="arrow2">
        <input type="radio" name="arrow" id="arrow3">

        <div class="arrow-track">
            <img src="../images/book1.jpg" alt="Книга 1">
            <img src="../images/book2.jpg" alt="Книга 2">
            <img src="../images/book3.jpg" alt="Книга 3">
        </div>

        <div class="arrows">
            <label for="arrow1" class="prev prev1">←</label>
            <label for="arrow2" class="next next2">→</label>

            <label for="arrow2" class="prev prev2">←</label>
            <label for="arrow3" class="next next3">→</label>

            <label for="arrow3" class="prev prev3">←</label>
            <label for="arrow1" class="next next1">→</label>
        </div>

    </div>

    <p>
        <a href="../index.html">Вернуться на главную</a>
    </p>

</body>

</html>
