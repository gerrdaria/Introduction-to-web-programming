<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <title>Слайдер на radio-кнопках</title>
    <link rel="stylesheet" href="slider.css">
</head>

<body>

    <h1>Слайдер книг на radio-кнопках</h1>

    <div class="radio-slider">

        <input type="radio" name="slide" id="slide1" checked>
        <input type="radio" name="slide" id="slide2">
        <input type="radio" name="slide" id="slide3">

        <div class="radio-track">
            <img src="../images/book1.jpg" alt="Книга 1">
            <img src="../images/book2.jpg" alt="Книга 2">
            <img src="../images/book3.jpg" alt="Книга 3">
        </div>

        <div class="radio-nav">
            <label for="slide1"></label>
            <label for="slide2"></label>
            <label for="slide3"></label>
        </div>

    </div>

    <p>
        <a href="../index.html">Вернуться на главную</a>
    </p>

</body>

</html>
