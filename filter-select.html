<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <title>Фильтрация через список</title>
    <link rel="stylesheet" href="css/filter-select.css">
</head>
<body>

    <h1>Фильтрация книг через выпадающий список</h1>

    <select id="genreFilter">
        <option value="all">Все жанры</option>
        <option value="fantasy">Фэнтези</option>
        <option value="detective">Детективы</option>
        <option value="classic">Классика</option>
    </select>

    <div class="catalog">
        <div class="card fantasy">Гарри Поттер<p>Фэнтези</p></div>
        <div class="card fantasy">Властелин колец<p>Фэнтези</p></div>
        <div class="card detective">Шерлок Холмс<p>Детектив</p></div>
        <div class="card detective">Убийство в Восточном экспрессе<p>Детектив</p></div>
        <div class="card classic">Война и мир<p>Классика</p></div>
        <div class="card classic">Преступление и наказание<p>Классика</p></div>
    </div>

    <p>
        <a href="index.html">Вернуться на главную</a>
    </p>
    <script>
        const genreFilter = document.getElementById("genreFilter");
        const cards = document.querySelectorAll(".card");

        genreFilter.onchange = function () {
            const selectedGenre = genreFilter.value;

            cards.forEach(function (card) {
                if (selectedGenre === "all" || card.classList.contains(selectedGenre)) {
                    card.style.display = "inline-block";
                } else {
                    card.style.display = "none";
                }
            });
        };
    </script>
</body>
</html>
