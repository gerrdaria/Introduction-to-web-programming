<!DOCTYPE html>

<html>

<head>
    <meta charset="UTF-8">
    <title>Обратная связь</title>
</head>

<body>


<h1>Обратная связь</h1>

<p>Пожалуйста, заполните форму.</p>

<form>

    <p>Ваше имя:</p>
    <input type="text" name="name">

    <p>Ваш возраст:</p>
    <input type="number" name="age">

    <p>Любимый жанр:</p>
    <select name="genre">
        <option>Фэнтези</option>
        <option>Детектив</option>
        <option>Классика</option>
        <option>Научная фантастика</option>
    </select>

    <p>Какие жанры вы читаете?</p>

    <input type="checkbox" name="fantasy">
    <label>Фэнтези</label>
    <br>

    <input type="checkbox" name="detective">
    <label>Детективы</label>
    <br>

    <input type="checkbox" name="classic">
    <label>Классика</label>
    <br>

    <input type="checkbox" name="science">
    <label>Научная фантастика</label>

    <p>Читаете ли вы электронные книги?</p>

    <input type="radio" name="ebook" value="yes">
    <label>Да</label>

    <input type="radio" name="ebook" value="no">
    <label>Нет</label>

    <p>Подписаться на новости магазина:</p>

    <input type="checkbox" name="news">

    <p>Ваше сообщение:</p>

    <textarea name="message" rows="5" cols="40"></textarea>

    <br><br>

    <input type="submit" value="Отправить">

</form>

<p>
    <a href="index.html">Вернуться на главную</a>
</p>


</body>

</html>
