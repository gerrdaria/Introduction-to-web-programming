<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <title>Фильтрация книг</title>

    <link rel="stylesheet" href="css/filter.css">
</head>

<body>

    <h1>Фильтрация книг по жанру</h1>

    <div class="filter">

        <input type="radio" id="all" name="genre" checked>
        <label for="all">Все</label>

        <input type="radio" id="fantasy" name="genre">
        <label for="fantasy">Фэнтези</label>

        <input type="radio" id="detective" name="genre">
        <label for="detective">Детективы</label>

        <input type="radio" id="classic" name="genre">
        <label for="classic">Классика</label>

        <div class="books">
            <div class="book fantasy">Гарри Поттер</div>
            <div class="book fantasy">Властелин колец</div>

            <div class="book detective">Шерлок Холмс</div>
            <div class="book detective">Убийство в Восточном экспрессе</div>

            <div class="book classic">Война и мир</div>
            <div class="book classic">Преступление и наказание</div>
        </div>

    </div>

    <p>
        <a href="index.html">Вернуться на главную</a>
    </p>

</body>

</html>
